<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game Hub - Edit Game</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./stylesheets/gamesTheme.css" />
</head>
<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="addGames.html">Add Game</a> |
        <a href="editGames.html">Edit Game</a>
    </nav>

    <!-- Toast Container -->
    <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 11">
        <div id="toastContainer" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toastTitle"></strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <div class="container">
        <div class="form-container">
            <h2>Edit Game</h2>
            <form class="form">
                <!-- Visible input for the game ID -->
                <label for="id">Game ID</label>
                <div class="input-group mb-3">
                    <input type="text" id="id" name="id" placeholder="Enter game ID" required>
                    <button type="button" id="fetchGameBtn" class="btn btn-primary">Fetch Game</button>
                </div>

                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Enter title" required disabled>

                <label for="year">Year</label>
                <input type="number" id="year" name="year" placeholder="Enter year" required disabled>

                <label for="platform">Platform</label>
                <input type="text" id="platform" name="platform" placeholder="Enter platform" required disabled>

                <div class="button-container">
                    <button type="submit" class="submit-btn" disabled>Update</button>
                </div>
            </form>
        </div>
    </div>
   
    <!-- Scripts -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="./js/putGames.js" defer></script>
</body>
</html>
