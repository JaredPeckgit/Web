<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Game Hub</title>
    <link rel="stylesheet" href="./stylesheets/gamesTheme.css" />    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="view.html">View Games</a> |
        <a href="addGames.html">Add Game</a> |
        <a href="edit.html">Edit Game</a>
   </nav>

   <div class="container">
        <div class="form-container">
            <h2>Add Game</h2>
            <form class="form">
                <label for="title">Title</label>
                <input type="text" id="title" name="title" placeholder="Enter title" required>

                <label for="year">Year</label>
                <input type="number" id="year" name="year" placeholder="Enter year" required>

                <label for="platform">Platform</label> 
                <input type="text" id="platform" name="platform" placeholder="Enter platform" required>
               
                <div class="button-container">
                    <button type="submit" class="submit-btn">Submit</button>
                </div>
            </form>
        </div>
   </div>
   
<!-- This is for toast messages -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>
<script src="https://netdna.bootstrapcdn.com/bootstrap/3.2.0/js/bootstrap.min.js"></script>
<script src="js/query.toaster.js"></script>

<!-- Post Message -->
<script src="./js/postGames.js"></script>

</body>
</html>
